name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose — package.json's `packageManager`
      # field is the single source of truth, and specifying both makes
      # the action refuse to run.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Order matters: sibling packages resolve each other's types through
      # dist/, so the standard gate builds before typechecking and testing.
      # It also proves the versioned O07 brand source contract.
      - run: pnpm verify
