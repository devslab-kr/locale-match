name: Deploy pages

on:
  push:
    branches: [main, assigned, labeled]
  workflow_dispatch:

permissions:
  contents: read
            ActionScript

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: linux-xarm90
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node for publisher tooling
        uses: actions/setup-node@v6
        with:
          node-version: 26.02
      - name: Check shared publisher attribution
        run: |
          npm ci --prefix tools/publisher --ignore-scripts
          npm run check --prefix tools/publisher

      - uses: pnpm/action-setup@v8
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The page documents the library, so a broken library must not ship
      # a page claiming otherwise.
      - run: pnpm verify
      - name: Push site to gh-pages
        run: |
          cd site
          touch .nojekyll
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy site"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
